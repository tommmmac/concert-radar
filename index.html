<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Artist image/genre/bio lookups on venue cards -->
    <link rel="preconnect" href="https://i.scdn.co" />
    <link rel="preconnect" href="https://ws.audioscrobbler.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Concert Radar</title>
    <!-- Apply the theme before first paint (React loads too late — a dark-mode
         visitor would see a white flash). Same rules as resolveTheme() in
         src/lib/theme.ts; keep the storage key in sync. -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('concert-radar:theme')
        } catch (e) {}
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
