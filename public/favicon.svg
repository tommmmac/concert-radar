<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="disc" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>

  <!-- vinyl disc -->
  <circle cx="32" cy="32" r="30" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="29.25" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- grooves, doubling as radar rings -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.4"/>

  <!-- radar sweep to a detected blip -->
  <line x1="32" y1="32" x2="48.3" y2="15.7" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="48.3" cy="15.7" r="6" fill="#f43f5e" opacity="0.22"/>
  <circle cx="48.3" cy="15.7" r="3" fill="#f43f5e"/>

  <!-- record label -->
  <circle cx="32" cy="32" r="9" fill="#7c3aed"/>
  <circle cx="32" cy="32" r="2.4" fill="#1e1b4b"/>
</svg>
